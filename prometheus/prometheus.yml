global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'netwatch'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['netwatch-node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'netwatch-vm'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
    # Necessite le plugin ES prometheus-exporter (optionnel)
    honor_labels: true

  # ── Sondes actives Blackbox (HTTP / ICMP / TCP / DNS) ──
  # Les cibles + leur module sont dans blackbox-targets.yml (file_sd, rechargé
  # à chaud). Relabeling standard Blackbox : la cible devient le paramètre
  # `target`, le module vient du label, et l'adresse scrapée est l'exporter.
  - job_name: 'blackbox'
    metrics_path: /probe
    scrape_interval: 30s
    file_sd_configs:
      - files: ['/etc/prometheus/blackbox-targets.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox:9115'

  # Santé de l'exporter lui-même
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox:9115']

  # NetBox expose ses métriques Django/RQ quand METRICS_ENABLED=true
  - job_name: 'netbox'
    metrics_path: /metrics
    static_configs:
      - targets: ['netbox:8080']
