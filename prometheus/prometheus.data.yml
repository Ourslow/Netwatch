global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'netwatch'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Déploiement 2-VMs : un node-exporter par VM (Sensors fait de la capture
  # paquets, sa santé CPU/mémoire compte tout autant que celle de la VM Data).
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['netwatch-node-exporter:9100']
        labels:
          instance: 'netwatch-data'
      - targets: ['192.168.100.11:9100']
        labels:
          instance: 'netwatch-sensors'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
    # Necessite le plugin ES prometheus-exporter (optionnel)
    honor_labels: true

  - job_name: 'blackbox'
    metrics_path: /probe
    scrape_interval: 30s
    file_sd_configs:
      - files: ['/etc/prometheus/blackbox-targets.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox:9115'

  # Santé de l'exporter lui-même
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox:9115']

  # NetBox expose ses métriques Django/RQ quand METRICS_ENABLED=true
  - job_name: 'netbox'
    metrics_path: /metrics
    static_configs:
      - targets: ['netbox:8080']
