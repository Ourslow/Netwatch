services:
  # ============================================================
  # MOTEURS D'ANALYSE
  # ============================================================

  zeek:
    build: ./zeek
    container_name: netwatch-zeek
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - IFACE=${IFACE:-eth0}
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./zeek/scripts:/usr/local/zeek/share/zeek/site/scripts:ro
      - ./zeek/intel:/usr/local/zeek/share/zeek/site/intel:ro
      - zeek-logs:/zeek/logs
      - ./pcap:/pcap:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  snort:
    build: ./snort
    container_name: netwatch-snort
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - IFACE=${IFACE:-eth0}
      - SNORT_MONITORED_SERVER=${SNORT_MONITORED_SERVER:-127.0.0.1}
    volumes:
      - ./snort/snort.lua:/usr/local/etc/snort/snort.lua:ro
      - ./snort/local.rules:/usr/local/etc/rules/local.rules:ro
      - snort-logs:/var/log/snort
      - ./pcap:/pcap:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  suricata:
    build: ./suricata
    container_name: netwatch-suricata
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      - IFACE=${IFACE:-eth0}
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/local.rules:/etc/suricata/rules/local.rules:ro
      - suricata-logs:/var/log/suricata
      - ./pcap:/pcap:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # COLLECTE NETFLOW / IPFIX / SFLOW
  # ============================================================

  goflow2:
    image: netsampler/goflow2:latest
    container_name: netwatch-goflow2
    # Écoute sur 3 protocoles — output JSON ligne par ligne sur stdout
    # Filebeat capte les logs Docker du container et les indexe dans netflow-*
    command:
      - "-transport.file.sep=newline"
      - "-format=json"
      - "-listen"
      - "netflow://:2055"
      - "-listen"
      - "ipfix://:4739"
      - "-listen"
      - "sflow://:6343"
    ports:
      # Ports UDP exposés uniquement sur l'interface loopback
      - "127.0.0.1:2055:2055/udp"   # NetFlow v5/v9
      - "127.0.0.1:4739:4739/udp"   # IPFIX (NetFlow v10)
      - "127.0.0.1:6343:6343/udp"   # sFlow
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # PIPELINE DE DONNEES
  # ============================================================

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: netwatch-filebeat
    user: root
    # Le filebeat.yml est monté depuis l'hôte (propriétaire ≠ root) : on désactive
    # le contrôle strict de permissions qui refuse sinon de charger la config.
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - zeek-logs:/zeek/logs:ro
      - snort-logs:/var/log/snort:ro
      - suricata-logs:/var/log/suricata:ro
      # Accès aux logs Docker pour la collecte des logs goflow2
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: netwatch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es-data:/usr/share/elasticsearch/data
    ports:
      # Lié à localhost uniquement : ES n'a pas d'auth (xpack.security off).
      # Accès externe = via Grafana (datasource interne). Ne pas exposer sur 0.0.0.0.
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: netwatch-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/blackbox-targets.yml:/etc/prometheus/blackbox-targets.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      # Lié à localhost : Prometheus n'a pas d'auth. Grafana l'atteint via le réseau interne.
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: netwatch-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: netwatch-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      # URL non vide par défaut : sans webhook réel, Grafana refuse de démarrer
      # (le contact point Slack exige une URL non vide). Renseigner SLACK_WEBHOOK_URL pour activer.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-http://localhost/slack-not-configured}
      - AUTOBLOCK_WEBHOOK_SECRET=${AUTOBLOCK_WEBHOOK_SECRET:-}
      - AUTOBLOCK_HOST=${AUTOBLOCK_HOST:-host.docker.internal}
    extra_hosts:
      # Permet à Grafana (réseau bridge) d'atteindre AutoBlock (network_mode:host)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # ANALYSE COMPORTEMENTALE (RITA-lite)
  # ============================================================

  beacon-detect:
    build: ./beacon-detect
    container_name: netwatch-beacon-detect
    environment:
      - ES_URL=http://elasticsearch:9200
      - SCAN_INTERVAL_MIN=15
      - LOOKBACK_HOURS=2
      - MIN_CONNECTIONS=8
      - BEACON_CV_THRESHOLD=0.25
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # REPONSE AUTOMATIQUE (AutoBlock webhook)
  # ============================================================

  autoblock:
    build: ./autoblock
    container_name: netwatch-autoblock
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ES_URL=http://localhost:9200
      - WEBHOOK_PORT=5001
      - WEBHOOK_SECRET=${AUTOBLOCK_WEBHOOK_SECRET:-}
      - BLOCK_DURATION_MIN=${BLOCK_DURATION_MIN:-60}
      - MAX_BLOCKS_PER_HOUR=20
      - DRY_RUN=${AUTOBLOCK_DRY_RUN:-true}
      - ALLOWLIST=${AUTOBLOCK_ALLOWLIST:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # DETECTION ET BLOCAGE COLLABORATIF (CrowdSec)
  # ============================================================

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: netwatch-crowdsec
    environment:
      # Collections installées au premier démarrage du container.
      # Note: crowdsecurity/zeek n'existe pas dans le hub officiel (juin 2026).
      # Zeek logs lus via parsers syslog intégrés à crowdsecurity/linux.
      # crowdsecurity/suricata gère le format EVE JSON natif de Suricata.
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/nginx crowdsecurity/suricata
      - CUSTOM_HOSTNAME=netwatch-crowdsec
    volumes:
      # Config d'acquisition des sources de logs
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Base de données CrowdSec (décisions, bouncers, métriques)
      - crowdsec-db:/var/lib/crowdsec/data
      # Logs Zeek (read-only) — volume partagé avec le service zeek
      - zeek-logs:/zeek/logs:ro
      # Logs Suricata EVE JSON (read-only) — volume partagé avec le service suricata
      - suricata-logs:/var/log/suricata:ro
    restart: unless-stopped

  # ============================================================
  # AUTOMATISATION (n8n — workflows alertes ES → Teams)
  # ============================================================

  n8n:
    image: n8nio/n8n:latest
    container_name: netwatch-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Désactiver les diagnostics / télémétrie
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Basic auth — changer en prod
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD manquant dans .env}
      # Timezone pour les crons
      - GENERIC_TIMEZONE=Europe/Paris
      # Webhook base URL (pour callbacks externes)
      - WEBHOOK_URL=http://localhost:5678/
    extra_hosts:
      # Permet à n8n (bridge) d'atteindre ES sur l'hôte (127.0.0.1:9200)
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # ASSISTANT IA LOCAL (explication d'alertes, résumé exécutif)
  # ============================================================

  ollama:
    image: ollama/ollama:latest
    container_name: netwatch-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Modèle attendu par le portail : OLLAMA_MODEL (défaut "mistral")
    # Première utilisation : docker exec netwatch-ollama ollama pull mistral
    restart: unless-stopped

  # ============================================================
  # SONDES ACTIVES (Blackbox exporter — HTTP / ICMP / TCP / DNS)
  # Comble l'angle mort passif : mesure disponibilité + latence DEPUIS la sonde.
  # Cibles : prometheus/blackbox-targets.yml · modules : blackbox/blackbox.yml
  # ============================================================

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: netwatch-blackbox
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    cap_add:
      - NET_RAW            # ICMP
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9115:9115"
    restart: unless-stopped

  # ============================================================
  # EXPLORATION DES LOGS (Kibana — Discover sur zeek-* / suricata-* / snort-*)
  # Grafana pour les dashboards, Kibana pour fouiller : recherche libre,
  # pivot sur les champs, visualisation d'un document brut.
  # ============================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: netwatch-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - TELEMETRY_ENABLED=false
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-netwatch-kibana-encryption-key-32chars!!}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # VISIBILITÉ APPLICATIVE nDPI (ntopng — 300+ protocoles, temps réel)
  # Complète / valide le dictionnaire applicatif SNI du portail.
  # Capture sur l'hôte (network_mode host) → interface web sur :3001
  # (3000 est pris par Grafana). L'image embarque son propre Redis.
  # Pas de cap_drop ALL : l'entrypoint doit chown ses répertoires avant de
  # passer à l'utilisateur ntopng.
  # ============================================================

  ntopng:
    image: ntop/ntopng:latest      # seul tag publié sur Docker Hub (pas de 'stable')
    container_name: netwatch-ntopng
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - "--interface=${IFACE:-eth0}"
      - "--http-port=127.0.0.1:3001"
      - "--disable-login=1"          # labo : pas d'auth (lié à localhost) — retirer en prod
      - "--community"
    volumes:
      - ntopng-data:/var/lib/ntopng
    restart: unless-stopped

  # ============================================================
  # FULL PACKET CAPTURE INDEXÉE (Arkime — ex-Moloch)
  # Matérialise la notion de « point d'écoute » : sessions indexées dans l'ES
  # existant, PCAP complet sur disque, extraction à la demande depuis le viewer
  # (:8005). Capture sur l'hôte → network_mode host, ES via 127.0.0.1:9200.
  # Premier lancement : `make arkime-init` (init de la base + admin), puis `make start`.
  # Dimensionner le disque : ./arkime/raw (PCAP) — voir ARKIME_MAX_DISK dans .env.
  # ============================================================

  arkime:
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: netwatch-arkime
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
    environment:
      - ARKIME__elasticsearch=http://127.0.0.1:9200
      - ARKIME__interface=${IFACE:-eth0}
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:?ARKIME_PASSWORD_SECRET manquant dans .env}
      - ARKIME__pcapDir=/opt/arkime/raw
      - ARKIME__maxFileSizeG=2
      - ARKIME__freeSpaceG=${ARKIME_FREE_SPACE_G:-10%}
      - ARKIME__viewPort=8005
      - ARKIME__viewHost=127.0.0.1
      - ARKIME__plugins=
    # L'image n'a pas d'entrypoint : docker.sh <mode> [options] génère config.ini
    # depuis les ARKIME__* puis lance capture + viewer. --update-geo télécharge
    # OUI / RIR / GeoIP au démarrage (sans quoi capture refuse de démarrer) —
    # en labo isolé, copier les fichiers dans le volume arkime-etc. --add-admin
    # est idempotent (admin/admin si absent — changer le mot de passe dans le viewer).
    entrypoint: ["/opt/arkime/bin/docker.sh"]
    command: ["capture-viewer", "--wait-for-db", "http://127.0.0.1:9200", "--update-geo", "--add-admin", "--forever"]
    volumes:
      - ./arkime/raw:/opt/arkime/raw
      - arkime-etc:/opt/arkime/etc
      - ./pcap:/pcap:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # SOURCE DE VÉRITÉ INVENTAIRE / IPAM (NetBox)
  # Enrichit le portail : IP → site, rôle, VLAN, propriétaire ; import des
  # préfixes en hostgroups. API sur :8000, token dans .env (NETBOX_TOKEN).
  # ============================================================

  netbox-postgres:
    image: postgres:16-alpine
    container_name: netwatch-netbox-postgres
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=${NETBOX_DB_PASSWORD:?NETBOX_DB_PASSWORD manquant dans .env}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  netbox-redis:
    image: redis:7-alpine
    container_name: netwatch-netbox-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NETBOX_REDIS_PASSWORD:?NETBOX_REDIS_PASSWORD manquant dans .env}"]
    volumes:
      - netbox-redis-data:/data
    restart: unless-stopped

  netbox-redis-cache:
    image: redis:7-alpine
    container_name: netwatch-netbox-redis-cache
    command: ["redis-server", "--requirepass", "${NETBOX_REDIS_PASSWORD}"]
    restart: unless-stopped

  netbox:
    image: netboxcommunity/netbox:v4.7-5.1.1
    container_name: netwatch-netbox
    environment: &netbox-env
      - DB_HOST=netbox-postgres
      - DB_NAME=netbox
      - DB_USER=netbox
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis
      - REDIS_PASSWORD=${NETBOX_REDIS_PASSWORD}
      - REDIS_DATABASE=0
      - REDIS_CACHE_HOST=netbox-redis-cache
      - REDIS_CACHE_PASSWORD=${NETBOX_REDIS_PASSWORD}
      - REDIS_CACHE_DATABASE=1
      - SECRET_KEY=${NETBOX_SECRET_KEY:?NETBOX_SECRET_KEY manquant dans .env (50 caractères min)}
      - ALLOWED_HOSTS=*
      - CORS_ORIGIN_ALLOW_ALL=True
      - SKIP_SUPERUSER=false
      - SUPERUSER_NAME=${NETBOX_SUPERUSER_NAME:-admin}
      - SUPERUSER_EMAIL=${NETBOX_SUPERUSER_EMAIL:-admin@netwatch.local}
      - SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD:?NETBOX_SUPERUSER_PASSWORD manquant dans .env}
      # Token API v2 (NetBox ≥ 4.6) = identifiant public (12 alnum) + secret (40 alnum),
      # stocké en HMAC avec le « pepper » ci-dessous (sans pepper, les tokens v2 sont refusés).
      # Le portail envoie « Authorization: Bearer nbt_<KEY>.<TOKEN> ».
      - API_TOKEN_PEPPER_1=${NETBOX_API_TOKEN_PEPPER:?NETBOX_API_TOKEN_PEPPER manquant dans .env (50 caractères min)}
      - SUPERUSER_API_KEY=${NETBOX_TOKEN_KEY:?NETBOX_TOKEN_KEY manquant dans .env (12 caractères alphanumériques)}
      - SUPERUSER_API_TOKEN=${NETBOX_TOKEN:?NETBOX_TOKEN manquant dans .env (40 caractères alphanumériques)}
      - METRICS_ENABLED=true
      - GRAPHQL_ENABLED=false
      - RELEASE_CHECK_URL=
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    ports:
      - "127.0.0.1:8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s     # migrations + collectstatic au premier démarrage (~80 s en labo)
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_started
      netbox-redis-cache:
        condition: service_started
    restart: unless-stopped

  netbox-worker:
    image: netboxcommunity/netbox:v4.7-5.1.1
    container_name: netwatch-netbox-worker
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    environment: *netbox-env
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    # service_started (pas service_healthy) : au premier démarrage `up -d` abandonne le
    # worker si netbox n'est pas healthy dans le délai — restart: unless-stopped le fait
    # simplement réessayer jusqu'à ce que les migrations soient passées.
    depends_on:
      netbox:
        condition: service_started
    restart: unless-stopped

volumes:
  ntopng-data:
  arkime-etc:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  zeek-logs:
  snort-logs:
  suricata-logs:
  es-data:
  grafana-data:
  prometheus-data:
  ollama-data:
  # Volume persistant pour la base de données CrowdSec (décisions, bouncers)
  crowdsec-db:
  n8n-data:
