# NetWatch v2 — VM Data (déploiement 2-VMs, Shuttle Proxmox)
# Stockage/analyse + dashboards + automatisation. AutoBlock/Zeek/Suricata
# tournent sur la VM Sensors (192.168.100.11) — voir docker-compose.sensors.yml.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: netwatch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_HEAP:--Xms2g -Xmx2g}
    volumes:
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es-data:/usr/share/elasticsearch/data
    ports:
      # Lié à l'IP LAN de la VM Data : accessible depuis la VM Sensors
      # (filebeat/beacon-detect/autoblock), pas exposé au-delà de ce réseau.
      - "192.168.100.12:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: netwatch-prometheus
    volumes:
      - ./prometheus/prometheus.data.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/blackbox-targets.yml:/etc/prometheus/blackbox-targets.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      # Lié à l'IP LAN de la VM Data : le portail (sur un autre poste) doit
      # pouvoir l'atteindre pour la page /status.
      - "192.168.100.12:9090:9090"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: netwatch-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: netwatch-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Profil proxy : voir docker-compose.yml (sous-chemin /grafana/ + auth proxy)
      - GF_SERVER_ROOT_URL=${NETWATCH_PUBLIC_URL:-http://192.168.100.12:3000}${NETWATCH_PUBLIC_URL:+/grafana/}
      - GF_AUTH_PROXY_ENABLED=${NETWATCH_PUBLIC_URL:+true}
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-http://localhost/slack-not-configured}
      - AUTOBLOCK_WEBHOOK_SECRET=${AUTOBLOCK_WEBHOOK_SECRET:-}
      # AutoBlock tourne sur la VM Sensors en 2-VMs, plus sur le même hôte que Grafana.
      - AUTOBLOCK_HOST=192.168.100.11
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Lié à l'IP LAN de la VM Data : le portail doit pouvoir l'atteindre.
      - "192.168.100.12:3000:3000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: netwatch-n8n
    ports:
      # Lié à l'IP LAN de la VM Data : accessible pour la démo depuis un
      # autre poste (portail / navigateur), comme grafana/prometheus.
      - "192.168.100.12:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD manquant dans .env}
      - GENERIC_TIMEZONE=Europe/Paris
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Édition IA uniquement (COMPOSE_PROFILES=ia dans .env). Prévoir +4-5 Go de RAM
  # sur la VM Data avec mistral — voir docs/shuttle-deployment-plan.md §3.
  ollama:
    image: ollama/ollama:latest
    container_name: netwatch-ollama
    profiles: ["ia"]
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      # Lié à l'IP LAN Data : le portail (autre poste) l'atteint via OLLAMA_URL.
      - "192.168.100.12:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # ============================================================
  # OBSERVABILITÉ COMPLÉMENTAIRE côté données (voir docker-compose.yml pour les
  # commentaires détaillés). Arkime et ntopng sont sur la VM Sensors.
  # ============================================================

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: netwatch-blackbox
    cap_add:
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "192.168.100.12:9115:9115"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: netwatch-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Profil proxy : voir docker-compose.yml (sous-chemin /kibana)
      - SERVER_PUBLICBASEURL=${NETWATCH_PUBLIC_URL:-http://192.168.100.12:5601}${NETWATCH_PUBLIC_URL:+/kibana}
      - SERVER_BASEPATH=${NETWATCH_PUBLIC_URL:+/kibana}
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-netwatch-kibana-encryption-key-32chars}
      - TELEMETRY_ENABLED=false
    ports:
      - "192.168.100.12:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  netbox-postgres:
    image: postgres:16-alpine
    container_name: netwatch-netbox-postgres
    environment:
      - POSTGRES_USER=netbox
      - POSTGRES_DB=netbox
      - POSTGRES_PASSWORD=${NETBOX_DB_PASSWORD:?NETBOX_DB_PASSWORD manquant dans .env}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  netbox-redis:
    image: redis:7-alpine
    container_name: netwatch-netbox-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NETBOX_REDIS_PASSWORD:?NETBOX_REDIS_PASSWORD manquant dans .env}"]
    volumes:
      - netbox-redis-data:/data
    restart: unless-stopped

  netbox-redis-cache:
    image: redis:7-alpine
    container_name: netwatch-netbox-redis-cache
    command: ["redis-server", "--requirepass", "${NETBOX_REDIS_PASSWORD}"]
    restart: unless-stopped

  netbox:
    image: netboxcommunity/netbox:v4.7-5.1.1
    container_name: netwatch-netbox
    environment: &netbox-env
      - DB_HOST=netbox-postgres
      - DB_NAME=netbox
      - DB_USER=netbox
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis
      - REDIS_PASSWORD=${NETBOX_REDIS_PASSWORD}
      - REDIS_DATABASE=0
      - REDIS_CACHE_HOST=netbox-redis-cache
      - REDIS_CACHE_PASSWORD=${NETBOX_REDIS_PASSWORD}
      - REDIS_CACHE_DATABASE=1
      - SECRET_KEY=${NETBOX_SECRET_KEY:?NETBOX_SECRET_KEY manquant dans .env (50 caractères min)}
      - ALLOWED_HOSTS=*
      - CORS_ORIGIN_ALLOW_ALL=True
      # Profil proxy : voir docker-compose.yml (sous-chemin /netbox/)
      - BASE_PATH=${NETWATCH_PUBLIC_URL:+netbox/}
      - CSRF_TRUSTED_ORIGINS=${NETWATCH_PUBLIC_URL:-http://192.168.100.12:8000}
      - SKIP_SUPERUSER=false
      - SUPERUSER_NAME=${NETBOX_SUPERUSER_NAME:-admin}
      - SUPERUSER_EMAIL=${NETBOX_SUPERUSER_EMAIL:-admin@netwatch.local}
      - SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD:?NETBOX_SUPERUSER_PASSWORD manquant dans .env}
      - API_TOKEN_PEPPER_1=${NETBOX_API_TOKEN_PEPPER:?NETBOX_API_TOKEN_PEPPER manquant dans .env (50 caractères min)}
      - SUPERUSER_API_KEY=${NETBOX_TOKEN_KEY:?NETBOX_TOKEN_KEY manquant dans .env (12 caractères alphanumériques)}
      - SUPERUSER_API_TOKEN=${NETBOX_TOKEN:?NETBOX_TOKEN manquant dans .env (40 caractères alphanumériques)}
      - METRICS_ENABLED=true
      - GRAPHQL_ENABLED=false
      - RELEASE_CHECK_URL=
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    ports:
      - "192.168.100.12:8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_started
      netbox-redis-cache:
        condition: service_started
    restart: unless-stopped

  netbox-worker:
    image: netboxcommunity/netbox:v4.7-5.1.1
    container_name: netwatch-netbox-worker
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    environment: *netbox-env
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    depends_on:
      netbox:
        condition: service_started
    restart: unless-stopped

  # Point d'entrée HTTPS unique — profil « proxy » (voir docker-compose.yml et
  # caddy/Caddyfile). En 2 VMs, Caddy tourne ici (VM Data, avec le portail) et
  # joint Arkime / ntopng sur la VM Sensors via NETWATCH_UPSTREAM_*.
  caddy:
    image: caddy:2.8-alpine
    container_name: netwatch-caddy
    profiles: ["proxy"]
    network_mode: host
    environment:
      - NETWATCH_PUBLIC_URL=${NETWATCH_PUBLIC_URL:-https://localhost}
      - NETWATCH_TLS=${NETWATCH_TLS:-internal}
      - NETWATCH_UPSTREAM_PORTAL=${NETWATCH_UPSTREAM_PORTAL:-localhost:5050}
      - NETWATCH_UPSTREAM_GRAFANA=${NETWATCH_UPSTREAM_GRAFANA:-192.168.100.12:3000}
      - NETWATCH_UPSTREAM_KIBANA=${NETWATCH_UPSTREAM_KIBANA:-192.168.100.12:5601}
      - NETWATCH_UPSTREAM_ARKIME=${NETWATCH_UPSTREAM_ARKIME:-192.168.100.11:8005}
      - NETWATCH_UPSTREAM_NTOPNG=${NETWATCH_UPSTREAM_NTOPNG:-192.168.100.11:3001}
      - NETWATCH_UPSTREAM_NETBOX=${NETWATCH_UPSTREAM_NETBOX:-192.168.100.12:8000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  es-data:
  grafana-data:
  prometheus-data:
  ollama-data:
  n8n-data:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-media:
  netbox-reports:
  netbox-scripts:
