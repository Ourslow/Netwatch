# Site produit (site/) publié sur GitHub Pages : https://ourslow.github.io/Netwatch/
# Source Pages = « GitHub Actions » (activée automatiquement par configure-pages si nécessaire).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Vérifier le HTML (liens et images locaux)
        run: |
          cd site
          python3 - <<'EOF'
          import re, os, sys
          html = open("index.html", encoding="utf-8").read()
          missing = [p for p in re.findall(r'(?:src|href)="((?!https?:|#|mailto:)[^"]+)"', html) if not os.path.exists(p.split("?")[0])]
          if missing:
              print("Fichiers manquants :", missing); sys.exit(1)
          print("OK —", len(re.findall(r"<section", html)), "sections")
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
