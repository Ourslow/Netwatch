# Images des cinq services construits localement (zeek, snort, suricata, beacon-detect, autoblock)
# publiées sur GHCR : ghcr.io/ourslow/netwatch-<service>:<version> (+ :latest, :sha-xxxxxxx).
# Déclenchée sur main (version = fichier VERSION) et sur les tags vX.Y.Z (version = tag).
# install.sh / upgrade.sh tirent ces images ; sans accès à GHCR, ils reconstruisent en local.
name: images

on:
  push:
    branches: [main]
    paths: ["zeek/**", "snort/**", "suricata/**", "beacon-detect/**", "autoblock/**", "VERSION", ".github/workflows/images.yml"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [zeek, snort, suricata, beacon-detect, autoblock]
    steps:
      - uses: actions/checkout@v4
      - name: Version (tag vX.Y.Z ou fichier VERSION)
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "→ $v"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/ourslow/netwatch-${{ matrix.service }}:${{ steps.v.outputs.version }}
            ghcr.io/ourslow/netwatch-${{ matrix.service }}:latest
            ghcr.io/ourslow/netwatch-${{ matrix.service }}:${{ steps.v.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
