name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portal:
    name: Portail — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - run: pip install -r portal/requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check portal scripts simulate-traffic.py
      - name: Tests portail + conventions
        run: pytest

  stack:
    name: Stack — compose, Prometheus, shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          # .env.example laisse les secrets vides ; compose exige ceux marqués ${VAR:?}.
          cp .env.example .env
          for v in $(grep -ohE '\$\{[A-Z_]+:\?' docker-compose*.yml | tr -d '${:?' | sort -u); do
            echo "$v=ci-placeholder-$(printf 'x%.0s' $(seq 1 50))" >> .env
          done
          for f in docker-compose.yml docker-compose.data.yml docker-compose.sensors.yml; do
            echo "== $f"; docker compose -f "$f" config --quiet
          done
      - name: docker compose config (profil proxy)
        run: |
          printf 'COMPOSE_PROFILES=proxy,ia\nNETWATCH_PUBLIC_URL=https://sonde.example\nARKIME_WEB_BASE_PATH=/arkime/\n' >> .env
          docker compose -f docker-compose.yml config --quiet
          # `config` rend l'environnement en mapping YAML (CLÉ: valeur), pas en CLÉ=valeur.
          docker compose -f docker-compose.yml config | grep -Eq 'GF_SERVER_ROOT_URL[=:] ?https://sonde\.example/grafana/'
      - name: caddy validate
        run: |
          for tls in internal admin@example.org; do
            docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -e NETWATCH_PUBLIC_URL=https://sonde.example -e NETWATCH_TLS="$tls" \
              caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
          done
      - name: promtool check
        # Monté à l'emplacement réel (/etc/prometheus) pour que rule_files et
        # file_sd de prometheus.yml se résolvent ; pas de glob : il ne serait pas
        # développé dans le conteneur.
        run: |
          promtool() { docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.51.0 "$@"; }
          for f in prometheus/rules/*.yml; do promtool check rules "/etc/prometheus/rules/$(basename "$f")"; done
          promtool check config /etc/prometheus/prometheus.yml
          promtool check config /etc/prometheus/prometheus.data.yml
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 bash -n
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S error
